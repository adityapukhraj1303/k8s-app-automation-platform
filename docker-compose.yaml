# ── Docker Compose — Local Development & Demo ─────────────────────────────────
# Run everything locally with a single command:
#   docker compose up --build
#
# Access:
#   App        → http://localhost:5000
#   Prometheus → http://localhost:9090
#   Grafana    → http://localhost:3000  (admin / admin123)
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

networks:
  platform-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:

services:

  # ── Flask Application ───────────────────────────────────────────────────────
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: k8s-platform-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      APP_NAME: k8s-automation-platform
      APP_VERSION: "1.0.0"
      ENVIRONMENT: development
      PORT: "5000"
    networks:
      - platform-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Prometheus ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus-local.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--storage.tsdb.retention.time=7d"
    networks:
      - platform-net
    depends_on:
      - app

  # ── Grafana ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.3.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - platform-net
    depends_on:
      - prometheus
