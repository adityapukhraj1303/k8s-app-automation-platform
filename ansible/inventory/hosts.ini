# ── Ansible Inventory ────────────────────────────────────────────────────────
# Defines the target hosts for Ansible playbooks.
# Update IP addresses and SSH key paths before running playbooks.

[k8s_master]
master-node ansible_host=10.0.1.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/k8s-key.pem

[k8s_workers]
worker-node-1 ansible_host=10.0.1.11 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/k8s-key.pem
worker-node-2 ansible_host=10.0.1.12 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/k8s-key.pem
worker-node-3 ansible_host=10.0.1.13 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/k8s-key.pem

[monitoring]
monitoring-node ansible_host=10.0.1.20 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/k8s-key.pem

[jenkins]
jenkins-node ansible_host=10.0.1.30 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/k8s-key.pem

# ── Groups ────────────────────────────────────────────────────────────────────
[k8s_cluster:children]
k8s_master
k8s_workers

[all:children]
k8s_cluster
monitoring
jenkins

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
env=production
aws_region=ap-south-1
ec2_instance_type=t3.small
