# ── Prometheus Config — Local / Docker Compose ────────────────────────────────
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:

  # Scrape Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Scrape Flask application metrics
  - job_name: k8s-platform-app
    static_configs:
      - targets: ["app:5000"]
    metrics_path: /metrics
    scrape_interval: 10s
