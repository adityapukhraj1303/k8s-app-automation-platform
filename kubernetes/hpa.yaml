# ── Horizontal Pod Autoscaler ─────────────────────────────────────────────────
# Automatically scales replica count based on CPU and memory utilization.
# Scales between 2 and 10 replicas based on 70% CPU / 80% memory thresholds.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: k8s-platform-hpa
  namespace: k8s-platform
  labels:
    app: k8s-platform-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: k8s-platform-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    # ── CPU-based scaling ────────────────────────────────────────────────────
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70   # Scale up when avg CPU > 70%

    # ── Memory-based scaling ─────────────────────────────────────────────────
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80   # Scale up when avg Memory > 80%

  # ── Scaling behavior ─────────────────────────────────────────────────────────
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60   # Wait 60s before scaling up again
      policies:
        - type: Pods
          value: 2                     # Add max 2 pods at a time
          periodSeconds: 60
        - type: Percent
          value: 50                    # Or 50% of current replicas
          periodSeconds: 60
      selectPolicy: Max

    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 min before scaling down
      policies:
        - type: Pods
          value: 1                     # Remove max 1 pod at a time
          periodSeconds: 120
      selectPolicy: Min
