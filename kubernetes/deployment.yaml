# ── Deployment ────────────────────────────────────────────────────────────────
# Runs the nginx static HTML/CSS app with 3 replicas on Linux hosts.
# Rolling updates with zero downtime. Health probes on /health and /ready.
# Build: docker build -t k8s-platform-app:latest ./app
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-platform-app
  namespace: k8s-platform
  labels:
    app: k8s-platform-app
    version: "2.0.0"
  annotations:
    description: "Kubernetes Application Automation Platform — Static HTML/CSS on nginx"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: k8s-platform-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # One extra pod during rolling update
      maxUnavailable: 0    # Zero-downtime — never kill before new pod is ready
  template:
    metadata:
      labels:
        app: k8s-platform-app
        version: "2.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: k8s-platform-sa
      terminationGracePeriodSeconds: 30

      # ── Application Container (nginx) ───────────────────────────────────────
      containers:
        - name: k8s-platform-app
          # Build locally: docker build -t k8s-platform-app:latest ./app
          # Minikube:      eval $(minikube docker-env) && docker build -t k8s-platform-app:latest ./app
          image: k8s-platform-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          # ── Environment (from ConfigMap) ────────────────────────────────────
          env:
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: k8s-platform-config
                  key: APP_NAME
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: k8s-platform-config
                  key: ENVIRONMENT
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: k8s-platform-config
                  key: APP_VERSION

          # ── Health Probes ───────────────────────────────────────────────────
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 5
            failureThreshold: 12   # Allow up to 60s for startup

          # ── Resource Limits ─────────────────────────────────────────────────
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

          # ── Volume Mounts ───────────────────────────────────────────────────
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run

      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}

      # ── Pod Scheduling: spread pods across nodes ─────────────────────────────
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - k8s-platform-app
                topologyKey: kubernetes.io/hostname

---
# ── ServiceAccount ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-platform-sa
  namespace: k8s-platform
  labels:
    app: k8s-platform-app
