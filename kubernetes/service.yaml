# ── Service ───────────────────────────────────────────────────────────────────
# Exposes the nginx pods as a stable network endpoint inside the cluster.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: k8s-platform-svc
  namespace: k8s-platform
  labels:
    app: k8s-platform-app
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "80"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: k8s-platform-app
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP

---
# ── NodePort Service (for local/Minikube access) ──────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: k8s-platform-svc-nodeport
  namespace: k8s-platform
  labels:
    app: k8s-platform-app
    type: nodeport
spec:
  type: NodePort
  selector:
    app: k8s-platform-app
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
