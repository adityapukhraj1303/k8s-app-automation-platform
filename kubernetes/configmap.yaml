# ── ConfigMap ─────────────────────────────────────────────────────────────────
# Non-sensitive application configuration injected as environment variables.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-platform-config
  namespace: k8s-platform
  labels:
    app: k8s-platform-app
    managed-by: ansible
data:
  APP_NAME: "k8s-automation-platform"
  APP_VERSION: "2.0.0"
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"

  # nginx config info
  SERVER: "nginx"
  SERVER_VERSION: "1.25"

  # ── Config file (mounted as volume) ────────────────────────────────────────
  app.conf: |
    [app]
    name = k8s-automation-platform
    version = 2.0.0
    environment = production

    [server]
    type = nginx
    port = 80

    [monitoring]
    health_path = /health
    ready_path  = /ready
